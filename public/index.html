.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}

.ph-hdr{position:sticky;top:0;z-index:40;background:rgba(251,248,243,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border-soft)}

/* 解析後端 secondary_oracle_sign_text（孔明結構化文字，移植自現行 index.html）*/
function parseKongmingText(text){
  if(!text)return null;var k={};var lines=text.split('\n');
  for(var i=0;i<lines.length;i++){var line=lines[i];
    if(line.indexOf('籤序：')===0)k.signOrder=line.substring(3);
    else if(line.indexOf('本卦：')===0){var m=line.substring(3).match(/^(.+?)（(.+?)·(.+?)）$/);if(m){k.curHex=m[1];k.palace=m[2];k.curEl=m[3];}else k.curHex=line.substring(3);}
    else if(line.indexOf('變爻：')===0)k.trigger=line.substring(3);
    else if(line.indexOf('變卦：')===0){var m2=line.substring(3).match(/^(.+?)（(.+?)）$/);if(m2){k.chgHex=m2[1];k.chgEl=m2[2];}else k.chgHex=line.substring(3);}
    else if(line.indexOf('籤等：')===0)k.fortuneLevel=line.substring(3);
    else if(line.indexOf('吉凶：')===0)k.fortuneCategory=line.substring(3);
    else if(line.indexOf('籤詩：')===0)k.poem=line.substring(3);
    else if(line.indexOf('解讀：')===0)k.interp=line.substring(3);
  }
  return k;
}
/* 解析後端 oracle_sign_text（籤詩）*/
function parseOracle(type,text){
  if(!type||!text)return null;var lines=text.split('\n');var head=lines[0]||'';
  var poem=(lines.find(function(l){return l.indexOf('詩：')===0;})||'').replace('詩：','');
  var lvl='';var m=head.match(/（(.+?)）/);if(m)lvl=m[1];
  var no=head.replace(/（.+?）/,'').replace(type+' ','').trim();
  return {type:type,no:no,poem:poem,level:lvl};
}

function startInterp(){
  var i=0,ring=document.getElementById("progRing"),C=339.3,t0=Date.now();
  var li=setInterval(function(){i=(i+1)%READING_LINES.length;var el=document.getElementById("interpLine");if(el){el.textContent=READING_LINES[i];el.classList.remove("fade");void el.offsetWidth;el.classList.add("fade");}},1800);
  /* 環圈推進到 95% 為止；真正完成由後端輪詢 go('result') 觸發 */
  var pr=setInterval(function(){var e=Math.min(0.95,(Date.now()-t0)/26000);if(ring)ring.setAttribute("stroke-dashoffset",C*(1-e));},80);
  interpTimer=function(){clearInterval(pr);clearInterval(li)};
}

/* ===== SVG charts ===== */
function radarSVG(size){
  var data=(STATE.result&&STATE.result.wuxing)||[];if(data.length<3)return"";
  var cx=size/2,cy=size/2,R=size/2-26,n=data.length;
  function pt(i,r){var a=-Math.PI/2+i*2*Math.PI/n;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]}
  function poly(r){return data.map(function(_,i){return pt(i,R*r).join(",")}).join(" ")}
  var val=data.map(function(d,i){return pt(i,R*d.v/100).join(",")}).join(" ");
  var s='<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">';
  [0.33,0.66,1].forEach(function(r){s+='<polygon points="'+poly(r)+'" fill="none" stroke="var(--rice-300)" stroke-width="1" opacity="0.7"/>'});
  data.forEach(function(_,i){var p=pt(i,R);s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="var(--rice-300)" stroke-width="1" opacity="0.6"/>'});
  s+='<polygon points="'+val+'" fill="var(--rose-300)" fill-opacity="0.34" stroke="var(--rose-500)" stroke-width="1.5" stroke-linejoin="round"/>';
  data.forEach(function(d,i){var p=pt(i,R*d.v/100);s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.6" fill="var(--rose-500)"/>'});
  data.forEach(function(d,i){var p=pt(i,R+15);s+='<text x="'+p[0]+'" y="'+p[1]+'" text-anchor="middle" dominant-baseline="middle" style="font-family:var(--font-serif);font-size:14px;fill:var(--ink-700)">'+d.k+'</text>'});
  return s+'</svg>';
}
function seasonSVG(paid){
  var fl=(STATE.result&&STATE.result.fortuneLine)||[];if(fl.length<2)return"";
  var data=fl.map(function(p){return (Number(p.score)+100)/2}),w=520,h=150,pad=8,max=100,min=0,n=data.length,cut=paid?n:Math.ceil(n/2);
  function X(i){return pad+i*(w-pad*2)/(n-1)}function Y(v){return h-pad-(v-min)/(max-min)*(h-pad*2)}
  var line=data.map(function(v,i){return(i?"L":"M")+X(i).toFixed(1)+","+Y(v).toFixed(1)}).join(" ");
  var area=line+" L"+X(n-1).toFixed(1)+","+h+" L"+X(0).toFixed(1)+","+h+" Z";
  var cutX=paid?w:X(cut);
  var s='<svg width="100%" height="'+h+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
   '<defs><linearGradient id="sf" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--rose-300)" stop-opacity="0.34"/><stop offset="100%" stop-color="var(--rose-300)" stop-opacity="0.02"/></linearGradient>'+
   '<clipPath id="fc"><rect x="0" y="0" width="'+cutX+'" height="'+h+'"/></clipPath><clipPath id="lc"><rect x="'+cutX+'" y="0" width="'+(w-cutX)+'" height="'+h+'"/></clipPath></defs>'+
   '<line x1="0" y1="'+h*0.5+'" x2="'+w+'" y2="'+h*0.5+'" stroke="var(--rice-200)" stroke-width="1"/>'+
   '<g clip-path="'+(paid?'':'url(#fc)')+'"><path d="'+area+'" fill="url(#sf)"/><path d="'+line+'" fill="none" stroke="var(--rose-500)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></g>';
  if(!paid)s+='<g clip-path="url(#lc)" style="filter:blur(4px);opacity:0.5"><path d="'+area+'" fill="url(#sf)"/><path d="'+line+'" fill="none" stroke="var(--rose-400)" stroke-width="2"/></g>'+
   '<line x1="'+cutX+'" y1="0" x2="'+cutX+'" y2="'+h+'" stroke="var(--rose-200)" stroke-width="1" stroke-dasharray="3 4"/>';
  return s+'</svg>';
}

 love:[["感情挽回","這段感情還能不能走？想挽回之前，先讀讀這些。"],["感情和合","兩個人怎麼走得更穩——關於相處與和合。"],["斬桃花","遇到不對的緣分，怎麼安全地放手。"]],
 work:[["開運招財","錢留不住、運卡住的時候，可以先做的事。"],["命理占卜","用命理看懂自己的時機與節奏。"],["星座運勢","從星象讀最近的工作運勢。"]],
 self:[["塔羅牌","塔羅怎麼幫你把混亂的心整理清楚。"],["星座運勢","從星座讀自己最近的狀態。"],["命理占卜","用命理看懂自己的時機與節奏。"]]
};
function blogSection(){
  var list=BLOG_LINKS[STATE.dir]||BLOG_LINKS.love;
  return '<section class="recs" style="margin-top:44px"><div class="head"><h2>想多讀一點——</h2><p>這些主題的文章，慢慢看，也許正好說中你現在的處境。</p></div>'+
    '<div class="rec-grid">'+list.map(function(b){
      return '<a class="rec" href="/blog/category/'+encodeURIComponent(b[0])+'/" target="_blank" rel="noopener">'+
        '<div class="top"><span class="rec-ic book">'+ic("book-open-text","thin")+'</span><span class="tag rose outline">專欄文章</span></div>'+
        '<div class="b"><h4>'+b[0]+'</h4><div class="reason">'+ic("quotes","fill")+'<p>'+b[1]+'</p></div>'+
        '<div class="foot"><span class="price"></span><span class="cta">看文章 '+ic("arrow-right")+'</span></div></div></a>';
    }).join("")+'</div></section>';
}

/* ===== Cooldown ===== */
function viewCooldown(){
  var c=STATE.cooldown||{};var when=c.available_at?fmtWhen(c.available_at):'';
  return '<div class="cool"><div class="glow"></div><div class="card"><span class="moon">'+ic("moon-stars","thin")+'</span>'+
    '<h1>我知道你很在意這件事。</h1>'+
    '<p style="font-family:var(--font-serif);font-weight:300;font-size:17.5px;line-height:1.95;color:var(--ink-700);margin:0 auto;max-width:26em;text-align:left">'+esc(c.message||'但情緒還熱的時候重複問同一題，解讀很容易被放大、被你心裡的不安帶著走。先讓這份心，靜一靜。')+'</p>'+
    (when?'<div class="when">'+ic("clock")+'<span>這一題，<b>'+esc(when)+'</b>可以再問</span></div>':'')+
    '<div class="cool-btns"><button class="btn secondary md" onclick="exitFlow()">'+ic("house-simple")+'回首頁</button><button class="btn primary md" onclick="openOA()">到 LINE 看看 '+ic("arrow-right")+'</button></div>'+
    '<p style="font-family:var(--font-sans);font-size:12px;color:var(--text-muted);margin-top:18px">這不是限制，是想陪你把心放穩一點。</p></div></div>';
}
function fmtWhen(iso){try{var d=new Date(iso);if(isNaN(d.getTime()))return iso;return (d.getMonth()+1)+'/'+d.getDate()+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());}catch(e){return iso;}}

/* ===== router ===== */
function render(){
  if(interpTimer){interpTimer();interpTimer=null;}
  var root=document.getElementById("root");
  var showHdr=STATE.step!=="cooldown"&&STATE.step!=="interpreting";
  var fn={topic:viewTopic,info:viewInfo,interpreting:viewInterp,result:viewResult,cooldown:viewCooldown}[STATE.step]||viewTopic;
  root.innerHTML=(showHdr?header():"")+fn();
  if(STATE.step==="info"&&!STATE.userId)mountGisButton();
  window.scrollTo(0,0);
  if(STATE.step==="interpreting")startInterp();
}
function go(s){STATE.step=s;render()}
function back(){var map={info:"topic",result:"info"};if(map[STATE.step])go(map[STATE.step])}
function exitFlow(){location.href="/";}
function openOA(){window.open(LINE_OA_URL,"_blank");}
function askAnother(){STATE.dir=null;STATE.sub=null;STATE.q=null;STATE.text="";STATE.result=null;STATE.paid=false;STATE.logId="";go("topic");}
function showInfoErr(msg){var e=document.getElementById("infoErr");if(e){e.textContent=msg;e.classList.remove("hidden");e.scrollIntoView({behavior:"smooth",block:"center"});}else{alert(msg);}}

/* ===== Google SSO auth ===== */
var googleIdToken="";
function getIdToken(){return googleIdToken||"";}
function authHeaders(extra){var h={"X-Google-Id-Token":getIdToken()};if(extra)for(var k in extra)h[k]=extra[k];return h;}

/* ===== validators ===== */
function validGmail(e){return /^[^\s@]+@gmail\.com$/i.test(e||"");}
function validPhoneTW(p){return /^09\d{8}$/.test((p||"").replace(/[\s-]/g,""));}
function phoneE164(p){p=(p||"").replace(/[\s-]/g,"");return p.indexOf("0")===0?"+886"+p.slice(1):p;}

/* ===== 表單收集 ===== */
function gatherInfo(){
  function v(id){var el=document.getElementById(id);return el?el.value.trim():"";}
  var surname=v("inSurname"),given=v("inGiven"),phone=v("inPhone").replace(/[\s-]/g,""),email=v("inEmail");
  var y=v("inYear"),m=v("inMonth"),d=v("inDay"),t=v("shichen");
  if(!surname)return{err:"請先輸入姓氏。"};
  if(!given)return{err:"請先輸入名字。"};
  if(!y||!m||!d)return{err:"請先選擇你的出生日期。"};
  if(!t)return{err:"請選擇出生時間（不確定可勾選午時）。"};
  if(!validPhoneTW(phone))return{err:"請輸入正確的手機號碼（例如 0912345678）。"};
  if(!validGmail(email))return{err:"Email 目前僅接受 @gmail.com 信箱。"};
  return{surname:surname,given:given,phone:phone,email:email,dob:y+"-"+pad2(m)+"-"+pad2(d)+" "+t};
}

/* ===== 分靈體 prefetch（best-effort）===== */
function soulPrefetch(){
  var btn=document.getElementById("soulBtn");if(!btn||STATE.soulConfirmed)return;
  if(!STATE.userId){showInfoErr("請先用 Google 登入（表單上方），分靈體才能認得你。");return;}
  var info=gatherInfo();if(info.err){showInfoErr(info.err);return;}
  btn.disabled=true;btn.innerHTML=ic("circle-notch")+'凝聚中…';
  fetch(API.prefetch,{method:"POST",headers:authHeaders({"Content-Type":"application/json"}),
    body:JSON.stringify({google_sub:STATE.userId,date_of_birth:info.dob,last_name:info.surname,first_name:info.given})})
   .then(function(r){return r.json();}).then(function(d){
     STATE.soulConfirmed=!!d.success;
     btn.disabled=false;btn.innerHTML=d.success?ic("check","bold")+'分靈體已上線':ic("sparkle")+'先認識它';
   }).catch(function(){btn.disabled=false;btn.innerHTML=ic("sparkle")+'再試一次';});
}

/* ===== 送出占卜 → interpreting → 輪詢 ===== */
function submitDivination(){
  if(STATE.submitting)return;
  if(!STATE.userId){showInfoErr("請先用 Google 登入（表單上方），我才能把這次的解讀保留給你。");return;}
  if(!STATE.text){showInfoErr("請先回到上一步，選一句想問的話。");return;}
  var info=gatherInfo();if(info.err){showInfoErr(info.err);return;}
  STATE.submitting=true;STATE.logId="";STATE.result=null;STATE.paid=false;
  go("interpreting");
  fetch(API.submit,{method:"POST",headers:authHeaders({"Content-Type":"application/json"}),
    body:JSON.stringify({google_sub:STATE.userId,question:STATE.text,divination_method:"雙占卜",
      date_of_birth:info.dob,last_name:info.surname,first_name:info.given,
      gender:(STATE.prefill&&STATE.prefill.gender)||"",phone:phoneE164(info.phone),email:info.email})})
   .then(function(resp){
     if(!resp.ok){return resp.json().catch(function(){return{};}).then(function(d){
       if(resp.status===429||d.blocked){STATE.cooldown={message:d.message,available_at:d.available_at};STATE.submitting=false;go("cooldown");return null;}
       if(d.error==="phone_duplicate"||d.error==="email_duplicate"){STATE.submitting=false;go("info");setTimeout(function(){showInfoErr(d.message||"此聯絡資料已被使用。");},60);return null;}
       throw new Error(d.message||("HTTP "+resp.status));
     });}
     return resp.json();
   })
   .then(function(data){
     if(!data)return;
     if(data.blocked){STATE.cooldown={message:data.message,available_at:data.available_at};STATE.submitting=false;go("cooldown");return;}
     if(data.success===false){STATE.submitting=false;go("info");setTimeout(function(){showInfoErr(data.message||"發生錯誤，請再試一次。");},60);return;}
     if(data.pending){pollStatus(data.log_id||"");return;}
     finishResult(data);
   })
   .catch(function(e){STATE.submitting=false;go("info");setTimeout(function(){showInfoErr("送出失敗："+e.message);},60);});
}

function pollStatus(logId){
  var attempts=0,max=23;
  var timer=setInterval(function(){
    attempts++;
    fetch(API.status+"?log_id="+encodeURIComponent(logId)+"&google_sub="+encodeURIComponent(STATE.userId),{headers:authHeaders()})
     .then(function(r){return r.json();}).then(function(d){
       if(d.ready&&d.summary){clearInterval(timer);finishResult(d,logId);}
       else if(attempts>=max){clearInterval(timer);STATE.submitting=false;go("info");setTimeout(function(){showInfoErr("占卜仍在進行，結果會透過 LINE 推送給你，請留意通知 🔔");},60);}
     }).catch(function(){if(attempts>=max){clearInterval(timer);STATE.submitting=false;go("info");setTimeout(function(){showInfoErr("連線中斷，結果會透過 LINE 推送給你。");},60);}});
  },4000);
}

function finishResult(d,logId){
  STATE.submitting=false;
  STATE.logId=d.log_id||d.reading_id||logId||"";
  if(d.next_action)STATE.talismanName=d.next_action.talisman_name||STATE.talismanName;
  STATE.result=buildResult(d);
  STATE.paid=!!d.purchased;
  go("result");
  if(STATE.logId)loadRecs(STATE.logId);
}

/* ===== 推薦 ===== */
function loadRecs(logId){
  fetch(API.recommend+"?log_id="+encodeURIComponent(logId)).then(function(r){return r.json();}).then(function(d){
    if(!STATE.result)return;
    STATE.result.recs=(d.success&&d.recommendations)?d.recommendations:[];
    var mount=document.getElementById("recsMount");
    if(mount&&STATE.result.recs.length){mount.innerHTML=recsInner(STATE.result.recs);mount.style.display="";}
  }).catch(function(){});
}

/* ===== 解鎖付款（ECPay）===== */
function createOrder(){
  if(STATE.ordering)return;
  var btn=document.getElementById("unlockBtn");
  if(!STATE.logId){alert("找不到占卜記錄，請重新占卜。");return;}
  STATE.ordering=true;
  if(btn){btn.disabled=true;btn.innerHTML=ic("circle-notch")+'建立訂單中…';}
  fetch(API.order,{method:"POST",headers:authHeaders({"Content-Type":"application/json"}),
    body:JSON.stringify({google_sub:STATE.userId,divination_log_id:Number(STATE.logId)||0,talisman_name:STATE.talismanName})})
   .then(function(r){return r.json();}).then(function(d){
     STATE.ordering=false;
     if(d.success&&d.pay_url){
       try{sessionStorage.setItem("winds_pending_log_id",STATE.logId);}catch(e){}
       var w=window.open(d.pay_url,"_blank");if(!w){location.href=d.pay_url;return;}
       if(btn){btn.disabled=false;btn.innerHTML=ic("arrow-clockwise")+'已開啟付款頁——完成後點我載入完整解讀';btn.onclick=function(){location.reload();};}
     }else{if(btn){btn.disabled=false;btn.innerHTML=ic("sparkle")+'解鎖完整解讀 · NT$ '+TALISMAN_PRICE;}alert(d.message||"建立訂單失敗，請再試一次。");}
   }).catch(function(e){STATE.ordering=false;if(btn){btn.disabled=false;btn.innerHTML=ic("sparkle")+'解鎖完整解讀 · NT$ '+TALISMAN_PRICE;}alert("付款錯誤："+e.message);});
}

/* ===== 分享（Web Share API / 剪貼簿）===== */
function shareResult(btn){
  var orig=btn?btn.innerHTML:"";
  if(btn){btn.disabled=true;btn.innerHTML=ic("circle-notch")+'生成分享圖中…';}
  var done=function(){if(btn){btn.disabled=false;btn.innerHTML=orig;}};
  /* 先請後端生成 OG 圖（有快取，失敗也照分享） */
  fetch(WORKER_API+"/generate-og-image",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({google_sub:STATE.userId})}).catch(function(){}).then(function(){
    done();
    var shareUrl="https://app.winds.tw/share?uid="+encodeURIComponent(STATE.userId)+"&t="+Date.now();
    var R=STATE.result||{};
    var snippet=(R.summary||"").replace(/[#*`>]/g,"").replace(/\s+/g," ").trim().slice(0,100);
    var shareText="🌀 找風問幸福 — 我的占卜結果\n\n"+(snippet?snippet+"…\n\n":"")+"你也來試試 ✨\n👉 "+shareUrl;
    if(navigator.share){
      navigator.share({title:"🌀 找風問幸福 — 我的占卜結果",text:shareText,url:shareUrl})
       .catch(function(){if(navigator.clipboard)navigator.clipboard.writeText(shareText).then(function(){alert("已複製分享內容 👍");});});
    }else if(navigator.clipboard){
      navigator.clipboard.writeText(shareText).then(function(){alert("已複製分享連結 👍\n可以貼到 LINE、Facebook、Threads 分享");});
    }else{
      prompt("請複製以下連結分享：",shareUrl);
    }
  });
}

/* ===== 預填（回訪）===== */
function doPrefill(){
  if(!STATE.userId)return;
  fetch(API.prefill+"?google_sub="+encodeURIComponent(STATE.userId),{headers:authHeaders()})
   .then(function(r){return r.json();}).then(function(d){
     if(d&&d.error==="maintenance"){location.href="/maintenance.html";return;}
     if(!d||!d.found)return;
     STATE.prefill={last_name:d.last_name||"",first_name:d.first_name||"",date_of_birth:d.date_of_birth||"",phone:d.phone||"",email:d.email||"",gender:d.gender||""};
     if(d.personality_profile)STATE.soulConfirmed=true;
     if(STATE.step==="info")render();
   }).catch(function(){});
}

/* ===== 開機（Google SSO）===== */
function adoptGoogleToken(tok){
  try{
    var p=JSON.parse(atob(tok.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
    if(p.exp&&p.exp*1000<Date.now())return false;
    googleIdToken=tok;STATE.userId=p.sub||"";
    STATE.gEmail=p.email||"";
    return !!STATE.userId;
  }catch(e){return false;}
}
function handleGoogleCredential(resp){
  if(!resp||!resp.credential)return;
  if(!adoptGoogleToken(resp.credential))return;
  try{localStorage.setItem("winds_google_token",resp.credential);}catch(e){}
  doPrefill();
  if(STATE.step==="info")render();
}
function initGoogleGIS(){
  if(typeof google==="undefined"||!google.accounts){setTimeout(initGoogleGIS,250);return;}
  google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:handleGoogleCredential,auto_select:true,context:"signin"});
  if(!STATE.userId)google.accounts.id.prompt();
  mountGisButton();
}
function mountGisButton(){
  if(STATE.userId)return;
  var el=document.getElementById("googleSignInBtn");
  if(!el||el.childNodes.length)return;
  if(typeof google==="undefined"||!google.accounts)return;
  google.accounts.id.renderButton(el,{theme:"outline",size:"large",text:"signin_with",shape:"pill",width:280,locale:"zh-TW"});
}
function boot(){
  var params=new URLSearchParams(location.search);
  var saved="";try{saved=localStorage.getItem("winds_google_token")||"";}catch(e){}
  if(saved&&!adoptGoogleToken(saved)){try{localStorage.removeItem("winds_google_token");}catch(e){}}
  var rid=params.get("log_id"),pending="";try{pending=sessionStorage.getItem("winds_pending_log_id")||"";}catch(e){}
  if(rid||pending){
    if(pending){try{sessionStorage.removeItem("winds_pending_log_id");}catch(e){}}
    STATE.step="interpreting";render();pollStatus(rid||pending);
    if(!STATE.userId)initGoogleGIS();
    return;
  }
  if(STATE.userId)doPrefill();
  render();
  initGoogleGIS();
}

boot();
</script>
