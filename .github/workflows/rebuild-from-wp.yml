name: rebuild-from-wp

# WordPress（wp.winds.tw）文章發佈／更新後重建 winds.tw：
# WP 端的 Code Snippet「winds 存檔後重建 winds.tw」會打 GitHub 的 repository_dispatch（event_type: wp-updated）；
# 也可以在 GitHub → Actions 頁手動按「Run workflow」。
# 同時只跑一支，排隊中的只留最新一筆（連續存檔不會排一長串）。
on:
  repository_dispatch:
    types: [wp-updated]
  workflow_dispatch:

concurrency:
  group: rebuild-from-wp
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WINDS_BLOG_SOURCE: wp
      WINDS_BLOG_STRICT: '1'   # WP 抓不到就讓這次重建失敗（GitHub 會寄信），不要拿程式碼裡的舊備份上線
      WP_SITE: https://wp.winds.tw
      WP_USER: uneedwind
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 9a26d689db9a85e827008477ed62961e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # winds-app 一律 wrangler deploy（Worker 模式），不能用 pages deploy
      - run: npx wrangler deploy
